[build]
  command = "npm run build"
  publish = "www"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/apk"
  to = "https://github.com/AVOcontrol/FIXTURE-HUNTER/releases/latest/download/AVOcontrol-Fixture-Hunter.apk"
  status = 302
